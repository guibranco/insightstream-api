# InsightStream API - Nginx reverse proxy server block
#
# Install: copy to /etc/nginx/sites-available/insightstream, then:
#   sudo ln -s /etc/nginx/sites-available/insightstream /etc/nginx/sites-enabled/insightstream
#   sudo nginx -t && sudo systemctl reload nginx
#
# Run certbot afterwards to add the HTTPS server block automatically:
#   sudo certbot --nginx -d api.example.com

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # Must match (or exceed) Ingest:MaxRequestBodyBytes / Kestrel's MaxRequestBodySize.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;

        proxy_read_timeout 90s;
    }

    location /health {
        proxy_pass http://127.0.0.1:5000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}
